name: Build RayNeo VR v0.5.1 Native SBS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Assemble v0.5.1 Native SBS source tree
        run: |
          rm -rf project
          mkdir project
          unzip -q RayNeo-VR-Controller-v0.2-COMBINED-CONTROLLER-LAB-SOURCE.zip -d project
          sed -i '/import androidx.annotation.Keep;/d' project/app/src/main/java/com/willflood/rayneovrcontroller/InputBridgeService.java
          sed -i '/^[[:space:]]*@Keep[[:space:]]*$/d' project/app/src/main/java/com/willflood/rayneovrcontroller/InputBridgeService.java

          gzip -dc v04-overrides/app/src/main/java/com/willflood/rayneovrcontroller/MainActivity.java > project/app/src/main/java/com/willflood/rayneovrcontroller/MainActivity.java
          gzip -dc v04-overrides/app/src/main/java/com/willflood/rayneovrcontroller/ControllerService.java > project/app/src/main/java/com/willflood/rayneovrcontroller/ControllerService.java
          cp v04-overrides/app/src/main/java/com/willflood/rayneovrcontroller/Tracker.java project/app/src/main/java/com/willflood/rayneovrcontroller/Tracker.java

          patch -d project -p1 < v041-overrides/vrlook-v041.patch
          patch -d project -p1 < v05-overrides/v05-main.patch
          python3 v051-overrides/patch_main.py project/app/src/main/java/com/willflood/rayneovrcontroller/MainActivity.java

          cp v051-overrides/app/build.gradle project/app/build.gradle
          cp v051-overrides/app/src/main/AndroidManifest.xml project/app/src/main/AndroidManifest.xml
          cp v051-overrides/app/src/main/java/com/willflood/rayneovrcontroller/SbsGLView.java project/app/src/main/java/com/willflood/rayneovrcontroller/SbsGLView.java
          cp v051-overrides/app/src/main/java/com/willflood/rayneovrcontroller/SbsMirrorService.java project/app/src/main/java/com/willflood/rayneovrcontroller/SbsMirrorService.java

          grep -n "versionName '0.5.1-native-sbs'" project/app/build.gradle
          grep -n "RAYNEO VR v0.5.1" project/app/src/main/java/com/willflood/rayneovrcontroller/MainActivity.java
          grep -n "CHECK AIR 4 PRO DISPLAY MODE\|probeNativeSbs" project/app/src/main/java/com/willflood/rayneovrcontroller/MainActivity.java
          grep -n "MOTION-ONLY 360" project/app/src/main/java/com/willflood/rayneovrcontroller/MainActivity.java
          grep -n "TURN_MOTION_ONLY\|movingOutward" project/app/src/main/java/com/willflood/rayneovrcontroller/ControllerService.java
          grep -n "findBestExternalDisplay\|NATIVE SBS WIDE MODE DETECTED\|RayNeo-v0.5.1-Native-SBS" project/app/src/main/java/com/willflood/rayneovrcontroller/SbsMirrorService.java
          grep -n "LEFT EYE.*RIGHT EYE\|drawEye" project/app/src/main/java/com/willflood/rayneovrcontroller/SbsGLView.java
          grep -n "SbsMirrorService\|FOREGROUND_SERVICE_MEDIA_PROJECTION\|ShizukuProvider" project/app/src/main/AndroidManifest.xml

      - name: Build v0.5.1 APK
        run: gradle -p project :app:assembleDebug --stacktrace

      - name: Verify v0.5.1 package
        run: |
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -1 | grep "versionName='0.5.1-native-sbs'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q "SbsMirrorService"
          if ! grep -R -q "rikka.shizuku.ShizukuProvider" project/app/build/intermediates/merged_manifest project/app/build/intermediates/merged_manifests 2>/dev/null; then
            echo "ShizukuProvider missing from merged manifest"
            exit 1
          fi
          echo "v0.5.1 Native SBS package verified"

      - name: Prepare APK
        run: |
          mkdir -p output
          cp project/app/build/outputs/apk/debug/app-debug.apk output/RayNeo-VR-Controller-v0.5.1-NATIVE-SBS.apk
          ls -lh output/RayNeo-VR-Controller-v0.5.1-NATIVE-SBS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RayNeo-VR-Controller-v0.5.1-NATIVE-SBS-APK
          path: output/RayNeo-VR-Controller-v0.5.1-NATIVE-SBS.apk
          if-no-files-found: error
