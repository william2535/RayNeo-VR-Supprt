name: Build RayNeo Combined Controller APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Extract v0.2 combined source
        run: |
          rm -rf project
          mkdir project
          unzip -q RayNeo-VR-Controller-v0.2-COMBINED-CONTROLLER-LAB-SOURCE.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle
          grep -n "versionName '0.2-combined-controller-lab'" project/app/build.gradle

      - name: Build v0.2 APK
        run: gradle -p project :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p output
          cp project/app/build/outputs/apk/debug/app-debug.apk output/RayNeo-VR-Controller-v0.2-COMBINED-LAB.apk
          ls -lh output/RayNeo-VR-Controller-v0.2-COMBINED-LAB.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RayNeo-VR-Controller-v0.2-COMBINED-LAB-APK
          path: output/RayNeo-VR-Controller-v0.2-COMBINED-LAB.apk
          if-no-files-found: error
