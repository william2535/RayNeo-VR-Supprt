name: Build RayNeo Daily Driver APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Assemble v0.3 source tree
        run: |
          rm -rf project
          mkdir project
          unzip -q RayNeo-VR-Controller-v0.2-COMBINED-CONTROLLER-LAB-SOURCE.zip -d project
          cp v03-overrides/app/build.gradle project/app/build.gradle
          cp v03-overrides/app/src/main/AndroidManifest.xml project/app/src/main/AndroidManifest.xml
          cp v03-overrides/app/src/main/java/com/willflood/rayneovrcontroller/MainActivity.java project/app/src/main/java/com/willflood/rayneovrcontroller/MainActivity.java
          cp v03-overrides/app/src/main/java/com/willflood/rayneovrcontroller/InputBridgeService.java project/app/src/main/java/com/willflood/rayneovrcontroller/InputBridgeService.java
          sed -i 's/RayNeo Combined Controller/RayNeo Daily Driver/g' project/app/src/main/java/com/willflood/rayneovrcontroller/ControllerService.java
          grep -n "versionName '0.3-daily-driver'" project/app/build.gradle
          grep -n "RAYNEO DAILY DRIVER v0.3" project/app/src/main/java/com/willflood/rayneovrcontroller/MainActivity.java
          grep -n "ShizukuProvider" project/app/src/main/AndroidManifest.xml

      - name: Build v0.3 APK
        run: gradle -p project :app:assembleDebug --stacktrace

      - name: Verify v0.3 package
        run: |
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -1 | grep "versionName='0.3-daily-driver'"
          if ! grep -R -q "rikka.shizuku.ShizukuProvider" project/app/build/intermediates/merged_manifest project/app/build/intermediates/merged_manifests 2>/dev/null; then
            echo "ShizukuProvider missing from merged manifest"
            exit 1
          fi
          echo "v0.3 Daily Driver package verified"

      - name: Prepare APK
        run: |
          mkdir -p output
          cp project/app/build/outputs/apk/debug/app-debug.apk output/RayNeo-VR-Controller-v0.3-DAILY-DRIVER.apk
          ls -lh output/RayNeo-VR-Controller-v0.3-DAILY-DRIVER.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RayNeo-VR-Controller-v0.3-DAILY-DRIVER-APK
          path: output/RayNeo-VR-Controller-v0.3-DAILY-DRIVER.apk
          if-no-files-found: error
