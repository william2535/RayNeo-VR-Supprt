name: Build RayNeo VR v0.5.4 Comfort Look APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Assemble v0.5.4 source tree
        run: |
          rm -rf project
          mkdir project
          unzip -q RayNeo-VR-Controller-v0.2-COMBINED-CONTROLLER-LAB-SOURCE.zip -d project

          # Proven Shizuku lifecycle / stale-EVIOCGRAB repair layer.
          cp v031-overrides/InputBridgeService.java project/app/src/main/java/com/willflood/rayneovrcontroller/InputBridgeService.java
          cp v031-overrides/IInputBridge.aidl project/app/src/main/aidl/com/willflood/rayneovrcontroller/IInputBridge.aidl

          # Working v0.4 / v0.4.1 VR-look stack.
          gzip -dc v04-overrides/app/src/main/java/com/willflood/rayneovrcontroller/MainActivity.java > project/app/src/main/java/com/willflood/rayneovrcontroller/MainActivity.java
          gzip -dc v04-overrides/app/src/main/java/com/willflood/rayneovrcontroller/ControllerService.java > project/app/src/main/java/com/willflood/rayneovrcontroller/ControllerService.java
          cp v04-overrides/app/src/main/java/com/willflood/rayneovrcontroller/Tracker.java project/app/src/main/java/com/willflood/rayneovrcontroller/Tracker.java
          patch -d project -p1 < v041-overrides/vrlook-v041.patch

          # Native SBS visual layer.
          patch -d project -p1 < v05-overrides/v05-main.patch
          python3 v051-overrides/patch_main.py project/app/src/main/java/com/willflood/rayneovrcontroller/MainActivity.java

          # v0.5.3 physical/virtual gamepad mapping + upright SBS fixes.
          patch -d project -p1 < v053-overrides/v053-controller.patch

          # v0.5.4 comfort behavior: edge-only 360 + remove head-speed boost.
          python3 v054-overrides/patch_controller.py project/app/src/main/java/com/willflood/rayneovrcontroller/ControllerService.java
          python3 v054-overrides/patch_ui.py project/app/src/main/java/com/willflood/rayneovrcontroller/MainActivity.java

          # Keep current Shizuku bridge generation; only the look mixer changed.
          perl -0pi -e 's/\.version\(\d+\)/.version(6)/' project/app/src/main/java/com/willflood/rayneovrcontroller/MainActivity.java
          sed -i 's/RAYNEO VR v0.5.1/RAYNEO VR v0.5.4/g' project/app/src/main/java/com/willflood/rayneovrcontroller/MainActivity.java

          cp v054-overrides/app/build.gradle project/app/build.gradle
          cp v051-overrides/app/src/main/AndroidManifest.xml project/app/src/main/AndroidManifest.xml
          sed -i 's/RayNeo VR v0.5.1 Native SBS/RayNeo VR v0.5.4 Native SBS/g' project/app/src/main/AndroidManifest.xml
          cp v051-overrides/app/src/main/java/com/willflood/rayneovrcontroller/SbsGLView.java project/app/src/main/java/com/willflood/rayneovrcontroller/SbsGLView.java
          cp v051-overrides/app/src/main/java/com/willflood/rayneovrcontroller/SbsMirrorService.java project/app/src/main/java/com/willflood/rayneovrcontroller/SbsMirrorService.java
          sed -i 's/v0\.5\.1/v0.5.4/g' project/app/src/main/java/com/willflood/rayneovrcontroller/SbsMirrorService.java

          # SurfaceTexture already transforms producer orientation; remove the old second Y-flip.
          patch -d project -p1 < v053-overrides/v053-sbs-orientation.patch

          grep -n "versionName '0.5.4-comfort-look-edge-360'" project/app/build.gradle
          grep -n "RAYNEO VR v0.5.4" project/app/src/main/java/com/willflood/rayneovrcontroller/MainActivity.java
          grep -F "360° edge starts at 75° yaw" project/app/src/main/java/com/willflood/rayneovrcontroller/MainActivity.java
          grep -F "turnThreshold=Math.max(i.getDoubleExtra(\"turnThreshold\",turnThreshold),yawLimit*0.94);" project/app/src/main/java/com/willflood/rayneovrcontroller/ControllerService.java
          grep -F "x=angleX;y=angleY;" project/app/src/main/java/com/willflood/rayneovrcontroller/ControllerService.java
          grep -F "hybridRateWeight=0.0" project/app/src/main/java/com/willflood/rayneovrcontroller/ControllerService.java
          grep -F "boolean androidTriggerAxes=supported(ABS_GAS)&&supported(ABS_BRAKE);" project/app/src/main/java/com/willflood/rayneovrcontroller/ControllerService.java
          grep -F "emit_ev(fd, EV_ABS, ABS_BRAKE, lt);" project/app/src/main/cpp/uinput_jni.c
          grep -F "emit_ev(fd, EV_ABS, ABS_GAS, rt);" project/app/src/main/cpp/uinput_jni.c
          grep -F "SurfaceTexture.getTransformMatrix() already supplies" project/app/src/main/java/com/willflood/rayneovrcontroller/SbsGLView.java
          grep -n "killStaleBridgeSiblings\|EBUSY" project/app/src/main/java/com/willflood/rayneovrcontroller/InputBridgeService.java
          grep -n "16777114" project/app/src/main/aidl/com/willflood/rayneovrcontroller/IInputBridge.aidl
          grep -n "SbsMirrorService\|FOREGROUND_SERVICE_MEDIA_PROJECTION\|ShizukuProvider" project/app/src/main/AndroidManifest.xml

      - name: Build v0.5.4 APK
        run: gradle -p project :app:assembleDebug --stacktrace

      - name: Verify v0.5.4 package
        run: |
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -1 | grep "versionName='0.5.4-comfort-look-edge-360'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q "SbsMirrorService"
          if ! grep -R -q "rikka.shizuku.ShizukuProvider" project/app/build/intermediates/merged_manifest project/app/build/intermediates/merged_manifests 2>/dev/null; then
            echo "ShizukuProvider missing from merged manifest"
            exit 1
          fi
          grep -q "killStaleBridgeSiblings" project/app/src/main/java/com/willflood/rayneovrcontroller/InputBridgeService.java
          grep -q "16777114" project/app/src/main/aidl/com/willflood/rayneovrcontroller/IInputBridge.aidl
          grep -q "androidTriggerAxes" project/app/src/main/java/com/willflood/rayneovrcontroller/ControllerService.java
          grep -Fq "yawLimit*0.94" project/app/src/main/java/com/willflood/rayneovrcontroller/ControllerService.java
          grep -Fq "x=angleX;y=angleY;" project/app/src/main/java/com/willflood/rayneovrcontroller/ControllerService.java
          grep -Fq "emit_ev(fd, EV_ABS, ABS_BRAKE, lt);" project/app/src/main/cpp/uinput_jni.c
          grep -Fq "emit_ev(fd, EV_ABS, ABS_GAS, rt);" project/app/src/main/cpp/uinput_jni.c
          grep -q "SurfaceTexture.getTransformMatrix() already supplies" project/app/src/main/java/com/willflood/rayneovrcontroller/SbsGLView.java
          echo "v0.5.4 comfort look + edge-only 360 package verified"

      - name: Prepare APK
        run: |
          mkdir -p output
          cp project/app/build/outputs/apk/debug/app-debug.apk output/RayNeo-VR-Controller-v0.5.4-COMFORT-LOOK-EDGE-360.apk
          ls -lh output/RayNeo-VR-Controller-v0.5.4-COMFORT-LOOK-EDGE-360.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RayNeo-VR-Controller-v0.5.4-COMFORT-LOOK-EDGE-360-APK
          path: output/RayNeo-VR-Controller-v0.5.4-COMFORT-LOOK-EDGE-360.apk
          if-no-files-found: error
