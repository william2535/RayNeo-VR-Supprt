name: Build RayNeo Combined Controller APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Extract and patch v0.2 combined source
        run: |
          rm -rf project
          mkdir project
          unzip -q RayNeo-VR-Controller-v0.2-COMBINED-CONTROLLER-LAB-SOURCE.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle
          sed -i '/import androidx.annotation.Keep;/d' project/app/src/main/java/com/willflood/rayneovrcontroller/InputBridgeService.java
          sed -i '/^[[:space:]]*@Keep[[:space:]]*$/d' project/app/src/main/java/com/willflood/rayneovrcontroller/InputBridgeService.java
          python3 -c 'from pathlib import Path; p=Path("project/app/src/main/AndroidManifest.xml"); s=p.read_text(); marker="        <service android:name=\".ControllerService\" android:exported=\"false\" />"; provider="        <provider\n            android:name=\"rikka.shizuku.ShizukuProvider\"\n            android:authorities=\"${applicationId}.shizuku\"\n            android:multiprocess=\"false\"\n            android:enabled=\"true\"\n            android:exported=\"true\"\n            android:permission=\"android.permission.INTERACT_ACROSS_USERS_FULL\" />\n\n"; p.write_text(s if "rikka.shizuku.ShizukuProvider" in s else s.replace(marker, provider + marker))'
          sed -i 's/versionCode 2/versionCode 3/' project/app/build.gradle
          sed -i "s/versionName '0.2-combined-controller-lab'/versionName '0.2.1-shizuku-fix'/" project/app/build.gradle
          sed -i 's/RAYNEO COMBINED CONTROLLER LAB v0.2/RAYNEO COMBINED CONTROLLER LAB v0.2.1/' project/app/src/main/java/com/willflood/rayneovrcontroller/MainActivity.java
          grep -n "ShizukuProvider" project/app/src/main/AndroidManifest.xml
          grep -n "versionCode 3\|versionName '0.2.1-shizuku-fix'" project/app/build.gradle

      - name: Build v0.2.1 APK
        run: gradle -p project :app:assembleDebug --stacktrace

      - name: Verify merged Shizuku manifest
        run: |
          if ! grep -R -q "rikka.shizuku.ShizukuProvider" project/app/build/intermediates/merged_manifest project/app/build/intermediates/merged_manifests 2>/dev/null; then
            echo "ShizukuProvider missing from merged manifest"
            exit 1
          fi
          echo "ShizukuProvider verified in merged manifest"

      - name: Prepare APK
        run: |
          mkdir -p output
          cp project/app/build/outputs/apk/debug/app-debug.apk output/RayNeo-VR-Controller-v0.2.1-SHIZUKU-FIX.apk
          ls -lh output/RayNeo-VR-Controller-v0.2.1-SHIZUKU-FIX.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RayNeo-VR-Controller-v0.2.1-SHIZUKU-FIX-APK
          path: output/RayNeo-VR-Controller-v0.2.1-SHIZUKU-FIX.apk
          if-no-files-found: error
