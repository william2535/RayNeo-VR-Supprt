plugins {
    id 'com.android.application'
}

android {
    namespace 'com.willflood.rayneovrcontroller'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.willflood.rayneovrcontroller'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '0.1-gamepad-lab'

        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '' } }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
}

dependencies { }
