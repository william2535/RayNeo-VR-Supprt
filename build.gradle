plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.willflood.rayneovrcontroller'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.willflood.rayneovrcontroller'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '0.1-gamepad-lab'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
    }

    // PHONE-FRIENDLY FLAT REPO MODE:
    // AndroidManifest.xml, *.java, CMakeLists.txt and uinput_jni.c can all
    // remain at the repository root. Gradle copies the Java sources into a
    // generated package directory before compiling.
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [file("$buildDir/flat-src")]
            res.srcDirs = []
        }
    }

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}

def flatJavaPackage = file("$buildDir/flat-src/com/willflood/rayneovrcontroller")

tasks.register('prepareFlatJava', Copy) {
    from(projectDir) {
        include 'MainActivity.java'
        include 'ControllerService.java'
        include 'NativeUInput.java'
        include 'Tracker.java'
    }
    into flatJavaPackage
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareFlatJava')
}

dependencies {
}
